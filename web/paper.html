<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain GAN Paper</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg: #fbfaf7; --fg: #1d2630; --muted: #5a6672; --line: #d8dde2; --accent: #0a5a9c;
          --box: #eef4f9; --box-line: #b9d0e3; --code: #f0efea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12171c; --fg: #dde3e8; --muted: #9aa7b2; --line: #2e3842;
      --accent: #7ab8ee; --box: #172430; --box-line: #2d4a63; --code: #1d242b; }
  }
  :root[data-theme="dark"] { --bg: #12171c; --fg: #dde3e8; --muted: #9aa7b2; --line: #2e3842;
    --accent: #7ab8ee; --box: #172430; --box-line: #2d4a63; --code: #1d242b; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center;
           padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
           font: 14px/1.4 system-ui, sans-serif; }
  header a { color: var(--accent); text-decoration: none; font-weight: 600; }
  header span { color: var(--muted); }
  @media (max-width: 520px) { header span { display: none; } }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 64px; }
  h1 { font-size: 1.9em; line-height: 1.2; margin: 1em 0 0.3em; }
  h2 { margin-top: 2em; padding-top: 0.3em; border-top: 1px solid var(--line); }
  h3 { margin-top: 1.6em; }
  h2, h3 { scroll-margin-top: 56px; }
  a { color: var(--accent); }
  img { display: block; max-width: 100%; height: auto; margin: 1em auto 0.2em; border-radius: 3px; }
  table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1em 0;
          font: 14px/1.4 system-ui, sans-serif; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  code { background: var(--code); padding: 1px 4px; border-radius: 3px; font-size: 0.88em; }
  pre { background: var(--code); padding: 10px; overflow-x: auto; border-radius: 4px; }
  pre code { padding: 0; }
  em { color: var(--muted); }
  nav.toc { font: 14px/1.5 system-ui, sans-serif; border: 1px solid var(--line); border-radius: 6px;
            padding: 8px 16px; margin: 1em 0; }
  nav.toc ul { margin: 0; padding-left: 1.2em; }
  nav.toc summary { cursor: pointer; font-weight: 600; }
  .onmap { font: 14px/1.45 system-ui, sans-serif; background: var(--box); border: 1px solid var(--box-line);
           border-radius: 6px; padding: 8px 12px; margin: 0.6em 0 1em; }
  .onmap strong { display: block; margin-bottom: 4px; }
  .onmap ul { margin: 0; padding-left: 1.1em; }
  .onmap li { margin: 3px 0; }
  .onmap li span { color: var(--muted); }
  #error { color: #b00; font: 15px system-ui, sans-serif; }
</style>
</head>
<body>
<header><a href="index.html">← Map</a><span>Every model set discussed here can be opened on the map.</span></header>
<main><p id="loading">Loading the paper…</p></main>
<script>
// Renders PAPER.md (copied next to this page by web/export_models.py --sets) and adds, under
// each section that discusses a model set, links that open that set on the map.
const main = document.querySelector("main");

function mapLink(set) {
  const query = new URLSearchParams({ set: set.name });
  if (set.view) for (const key of ["seed", "lon", "lat", "res"]) if (set.view[key] !== undefined) query.set(key, set.view[key]);
  return `index.html?${query}`;
}

Promise.all([
  fetch("PAPER.md").then((r) => { if (!r.ok) throw new Error(`PAPER.md: HTTP ${r.status}`); return r.text(); }),
  fetch("models/sets.json").then((r) => (r.ok ? r.json() : [])).catch(() => []),
]).then(([markdown, sets]) => {
  main.innerHTML = marked.parse(markdown);
  // Links to other files of the repository do not exist on this site.
  for (const a of main.querySelectorAll('a[href$=".md"]')) a.replaceWith(document.createTextNode(a.textContent));

  const bySection = new Map();
  for (const set of sets) {
    if (!set.section) continue;
    if (!bySection.has(set.section)) bySection.set(set.section, []);
    bySection.get(set.section).push(set);
  }

  const toc = [];
  for (const heading of main.querySelectorAll("h2, h3")) {
    const match = heading.textContent.match(/^(\d+(?:\.\d+)?)\.?\s/);
    const id = match ? `s${match[1].replace(".", "-")}` : heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    heading.id = id;
    toc.push({ id, text: heading.textContent, level: heading.tagName });
    const members = match ? bySection.get(match[1]) : null;
    if (!members) continue;
    const box = document.createElement("div");
    box.className = "onmap";
    box.innerHTML = "<strong>On the map</strong><ul></ul>";
    for (const set of members) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = mapLink(set);
      a.textContent = set.label;
      const note = document.createElement("span");
      note.textContent = ` — ${set.note || ""}`;
      li.append(a, note);
      box.querySelector("ul").append(li);
    }
    heading.after(box);
  }

  const nav = document.createElement("nav");
  nav.className = "toc";
  const details = document.createElement("details");
  details.innerHTML = "<summary>Contents</summary>";
  const list = document.createElement("ul");
  for (const { id, text, level } of toc) {
    const li = document.createElement("li");
    if (level === "H3") li.style.marginLeft = "1.2em";
    const a = document.createElement("a");
    a.href = `#${id}`;
    a.textContent = text;
    li.append(a);
    list.append(li);
  }
  details.append(list);
  nav.append(details);
  const abstract = main.querySelector("h2");
  main.insertBefore(nav, abstract);

  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  window.paperReady = { headings: toc.length, mapLinks: main.querySelectorAll(".onmap a").length };
}).catch((error) => {
  main.innerHTML = `<p id="error">Could not load the paper: ${error.message}</p>`;
  window.paperReady = { error: error.message };
});
</script>
</body>
</html>
