# Publishes the browser version (map, paper and legal notice) at the root of the Pages site.
name: Publish browser version

on:
  push:
    branches: [master]
    paths:
      - "web/index.html"
      - "web/paper.html"
      - "web/legal.html"
      - "PAPER.md"
      - "docs/figures/**"
      - "web/js/**"
      - "web/export_models.py"
      - "web/test/**"
      - "models/**"
      - "terrain_gan.py"
      - "generate.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Convert the models for the browser
        run: >
          uv run --no-project --python 3.12
          --index https://download.pytorch.org/whl/cpu
          --with torch==2.14.1 --with numpy --with pillow --with onnx --with onnxscript
          python web/export_models.py --sets models/sets.json
      - name: Check the page against PyTorch
        run: uv run --no-project --python 3.12 --with playwright python web/test/run_test.py
      - name: Collect the page
        run: |
          mkdir -p _site
          cp -r web/index.html web/paper.html web/legal.html web/PAPER.md web/docs web/js web/models _site/
          find _site -type f
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
