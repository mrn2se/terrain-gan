[project]
name = "terrain-gan"
version = "0.1.0"
description = "Seamless endless terrain GAN trained on global elevation data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "numpy",
    "rasterio",
    "pillow",
    "tensorboard",
    "setuptools<81",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
